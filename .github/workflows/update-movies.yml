name: Update movies

on:
schedule:
- cron: '0 13 * * *'
workflow_dispatch: {}

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

- uses: actions/setup-node@v4
with:
node-version: 20

- name: Fetch latest movies
run: node scripts/fetch-movies.js
env:
TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

- name: Commit if changed
run: |
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add movies.json
git diff --staged --quiet || git commit -m "Auto-update movies"
git push
