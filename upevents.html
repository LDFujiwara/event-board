<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #0d0b12;
    --movies: #12213d;
    --concerts: #0f3d3e;
    --social: #2c0f52;
    --markets: #123a1c;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background-color: var(--base);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,90,54,0.65), transparent 38%),
      radial-gradient(circle at 82% 8%, rgba(167,168,255,0.55), transparent 40%),
      radial-gradient(circle at 90% 55%, rgba(46,204,140,0.4), transparent 42%),
      radial-gradient(circle at 15% 70%, rgba(255,61,129,0.45), transparent 42%),
      radial-gradient(circle at 60% 95%, rgba(255,196,0,0.28), transparent 40%),
      radial-gradient(circle at 50% 40%, rgba(120,90,255,0.35), transparent 55%);
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: cover;
    font-family: 'Inter', sans-serif;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 70px;
    position: relative;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .wrap { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; padding: 0 16px; }

  /* ---- Header ---- */
  header.page-head {
    padding: 44px 0 20px;
    position: relative;
  }
  header.page-head::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 220px;
    height: 220px;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g fill='none' stroke='white' stroke-opacity='0.16' stroke-width='2'><rect x='30' y='20' width='70' height='70' rx='10'/><rect x='60' y='60' width='90' height='90' rx='14'/><circle cx='150' cy='40' r='28'/><circle cx='170' cy='150' r='16'/></g></svg>");
    background-repeat: no-repeat;
    pointer-events: none;
    z-index: -1;
  }
  header.page-head h1 {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 3rem;
    line-height: 0.98;
    letter-spacing: -0.01em;
    margin: 0;
  }

  /* ---- Filter tabs ---- */
  .tabs-outer {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 14px 0 16px;
    background: linear-gradient(180deg, rgba(18,18,18,0.92) 70%, rgba(18,18,18,0));
    margin: 0 -16px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    color: #fff;
    background: rgba(255,255,255,0.1);
    border: none;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .tab:hover { background: rgba(255,255,255,0.18); }
  .tab.active {
    background: #fff;
    color: #121212;
  }

  /* ---- Event list ---- */
  .events {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 18px;
  }

  .card {
    display: none;
    border-radius: 12px;
    padding: 16px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  .card.show { display: block; }

  .card .kind {
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .kind .recur {
    font-weight: 600;
    opacity: 0.85;
  }

  .card h3 {
    font-family: 'Archivo Black', sans-serif;
    font-weight: 400;
    font-size: 1.28rem;
    line-height: 1.08;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
    max-width: 90%;
  }

  .card .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 0.78rem;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
  }
  .card .meta .date-pill {
    background: rgba(255,255,255,0.16);
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 700;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.10), transparent 55%);
    pointer-events: none;
  }
  .card .place {
    display: block;
    margin-top: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
  }
  .card .note {
    display: block;
    margin-top: 6px;
    font-size: 0.76rem;
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.65);
  }

  .empty-msg {
    display: none;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    padding: 30px 10px;
  }
  .empty-msg.show { display: block; }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 0.76rem;
    margin-top: 40px;
    line-height: 1.7;
  }

  @media (max-width: 400px) {
    header.page-head h1 { font-size: 2.3rem; }
    .card h3 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">

  <header class="page-head">
    <h1>Upcoming Events</h1>
  </header>

  <div class="tabs-outer">
    <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="movies">Movies</button>
      <button class="tab" data-filter="concerts">Concerts</button>
      <button class="tab" data-filter="social">Fairs, Car Meets &amp; Social</button>
      <button class="tab" data-filter="markets">Farmers Markets</button>
    </div>
  </div>

  <div class="events" id="events"></div>
  <div class="empty-msg" id="emptyMsg">Nothing upcoming in this category right now — check back soon.</div>

  <footer>
    Dates and times can shift — worth a quick double check before you head out.<br>
    Got an event to add? Scan the recommendations code on the board.
  </footer>

</div>

<script>
  /* =========================================================
     DATED EVENTS
     One-time or date-ranged events. Add new ones here as they
     get announced. Anything whose date (or end date, for
     multi-day events) is before today is automatically hidden
     on page load — no manual cleanup needed.
     date / endDate format: 'YYYY-MM-DD'
     ========================================================= */
  // Concerts are NOT listed here anymore — they're pulled automatically
  // from concerts.json (kept up to date by a scheduled GitHub Action that
  // queries Ticketmaster). This array is now just for everything without
  // a good free live data source: movies, fairs, festivals, holiday markets.
  const DATED = [
    { cat:'social', kind:'Car Meet', title:'DMV Ride Out 2026', date:'2026-09-13', time:'9:00 AM', place:'Horner Rd Commuter Lot, Woodbridge' },
    { cat:'movies', kind:'Now in Theaters', title:'Resident Evil', date:'2026-09-18', place:'Franchise reboot, dir. Zach Cregger' },
    { cat:'social', kind:'Fair', title:'State Fair of Virginia', date:'2026-09-25', endDate:'2026-10-04', place:'Meadow Event Park, Doswell' },
    { cat:'social', kind:'Festival', title:'Occoquan Fall Arts & Crafts Show', date:'2026-09-26', endDate:'2026-09-27', time:'10 AM – 5 PM', place:'Historic Occoquan, VA', note:'300+ artisans, live music, beer garden by the river.' },
    { cat:'movies', kind:'Now in Theaters', title:'Digger', date:'2026-10-02', place:'Tom Cruise, dir. Alejandro G. Iñárritu' },
    { cat:'social', kind:'Festival', title:'Stonebridge Fall-O-Ween', date:'2026-10-24', time:'11:00 AM', place:'Stonebridge at Potomac Town Center, Woodbridge' },
    { cat:'social', kind:'Holiday Market', title:'Stonebridge Tree Lighting & Christmas Market', date:'2026-11-20', time:'5:00 – 9:00 PM', place:'Stonebridge at Potomac Town Center, Woodbridge' },
  ];

  // Fetched at load time from concerts.json (auto-updated by GitHub Actions).
  async function fetchConcerts() {
    try {
      const res = await fetch('concerts.json', { cache: 'no-store' });
      if (!res.ok) return [];
      const data = await res.json();
      return data.map(c => ({
        cat: 'concerts',
        kind: 'Concert',
        title: c.title,
        date: c.date,
        time: c.time,
        place: c.place,
      }));
    } catch (e) {
      console.warn('Could not load concerts.json', e);
      return [];
    }
  }

  /* =========================================================
     RECURRING EVENTS
     dow: 0=Sun ... 6=Sat. Each one's displayed date is always
     recalculated to its next real occurrence from today.
     weeksOfMonth / monthsActive are optional constraints.
     ========================================================= */
  const RECURRING = [
    { cat:'social', kind:'Car Meet', title:"Katie's Cars & Coffee", dow:6, time:'7:00 – 9:00 AM', place:"Katie's Coffee, 760 Walker Rd, Great Falls", recurLabel:'Every Saturday', note:'The big one. Get there early, the lot fills fast.' },
    { cat:'social', kind:'Car Meet', title:'Vienna Cars & Coffee', dow:0, weeksOfMonth:[1,3], time:'7:30 – 9:30 AM', place:'Cedar Park Shopping Center, Vienna', recurLabel:'1st & 3rd Sunday' },
    { cat:'markets', kind:'Farmers Market', title:'Prince William Farmers Market', dow:4, time:'3:00 – 7:00 PM', place:'7 County Complex Ct, Woodbridge', recurLabel:'Every Thursday' },
    { cat:'markets', kind:'Farmers Market', title:'Long Family Farmers Market', dow:4, monthsActive:[9], time:'2:00 – 7:00 PM', place:'Sentara NoVA Medical Center, Woodbridge', recurLabel:'Thu, through Sept' },
    { cat:'markets', kind:'Farmers Market', title:'Dale City Farmers Market', dow:0, time:'8:00 AM – 1:00 PM', place:'14090 Gemini Way, Woodbridge', recurLabel:'Every Sunday' },
    { cat:'markets', kind:'Farmers Market', title:"Tackett's Mill Tuesday Market", dow:2, monthsActive:[9,10], time:'3:30 – 6:30 PM', place:"2231 Tackett's Mill Dr, Lake Ridge", recurLabel:'Tue, through Oct' },
  ];

  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseISO(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function startOfToday() {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function shortLabel(d) {
    return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`;
  }
  function rangeLabel(d1, d2) {
    if (d1.getMonth() === d2.getMonth()) {
      return `${MONTHS_SHORT[d1.getMonth()]} ${d1.getDate()}–${d2.getDate()}`;
    }
    return `${shortLabel(d1)} – ${shortLabel(d2)}`;
  }

  function nextOccurrence(rule, today) {
    for (let i = 0; i < 120; i++) {
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      if (d.getDay() !== rule.dow) continue;
      if (rule.monthsActive && !rule.monthsActive.includes(d.getMonth() + 1)) continue;
      if (rule.weeksOfMonth) {
        const weekOfMonth = Math.ceil(d.getDate() / 7);
        if (!rule.weeksOfMonth.includes(weekOfMonth)) continue;
      }
      return d;
    }
    return null;
  }

  async function buildEventList() {
    const today = startOfToday();
    const items = [];
    const concerts = await fetchConcerts();
    const allDated = DATED.concat(concerts);

    allDated.forEach(ev => {
      const start = parseISO(ev.date);
      const end = ev.endDate ? parseISO(ev.endDate) : start;
      if (end < today) return; // fully passed — drop it
      items.push({
        ...ev,
        sortDate: start,
        dateLabel: ev.endDate ? rangeLabel(start, end) : shortLabel(start),
      });
    });

    RECURRING.forEach(rule => {
      const occ = nextOccurrence(rule, today);
      if (!occ) return; // rule has no more valid occurrences (e.g. season ended)
      items.push({
        cat: rule.cat,
        kind: rule.kind,
        title: rule.title,
        time: rule.time,
        place: rule.place,
        note: rule.note,
        recurLabel: rule.recurLabel,
        sortDate: occ,
        dateLabel: shortLabel(occ),
      });
    });

    items.sort((a, b) => a.sortDate - b.sortDate);
    return items;
  }

  async function renderEvents() {
    const container = document.getElementById('events');
    container.innerHTML = '';
    const events = await buildEventList();

    events.forEach(ev => {
      const card = document.createElement('div');
      card.className = 'card show';
      card.dataset.cat = ev.cat;
      card.style.background = `var(--${ev.cat})`;

      const kindHtml = ev.recurLabel
        ? `${ev.kind} <span class="recur">· ${ev.recurLabel}</span>`
        : ev.kind;

      card.innerHTML = `
        <div class="kind">${kindHtml}</div>
        <h3>${ev.title}</h3>
        <div class="meta">
          <span class="date-pill">${ev.dateLabel}</span>
          ${ev.time ? `<span>${ev.time}</span>` : ''}
        </div>
        ${ev.place ? `<span class="place">${ev.place}</span>` : ''}
        ${ev.note ? `<span class="note">${ev.note}</span>` : ''}
      `;
      container.appendChild(card);
    });

    applyFilter(document.querySelector('.tab.active').dataset.filter);
  }

  function applyFilter(filter) {
    const cards = document.querySelectorAll('.card');
    let visibleCount = 0;
    cards.forEach(card => {
      const match = filter === 'all' || card.dataset.cat === filter;
      card.classList.toggle('show', match);
      if (match) visibleCount++;
    });
    document.getElementById('emptyMsg').classList.toggle('show', visibleCount === 0);
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      applyFilter(tab.dataset.filter);
    });
  });

  renderEvents();
</script>

</body>
</html>
